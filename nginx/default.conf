server {
    listen 80;

    # React frontend
    location / {
        proxy_pass http://frontend:80; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Flask API
    location /api/ {
        proxy_pass http://backend:5000; # <-- Removed the trailing slash here!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}